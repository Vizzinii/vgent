<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vgent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36;
    --text: #e6e6e6; --dim: #8b93a3; --accent: #4f8cff;
    --user: #2b3a5c; --tool: #20242e; --danger: #e5534b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; overflow: hidden;
  }
  /* 侧栏 */
  #sidebar {
    width: 230px; min-width: 230px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  #sidebar h1 { font-size: 16px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  #sidebar h1 span { color: var(--accent); }
  #session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    margin-bottom: 4px; border: 1px solid transparent;
  }
  .session-item:hover { background: #1d222c; }
  .session-item.active { background: #1d222c; border-color: var(--accent); }
  .session-item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .m { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .session-item .badge {
    font-size: 11px; color: var(--dim); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 5px; margin-left: 6px;
  }
  #sidebar .actions { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  /* 主区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #header .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .meta { font-size: 12px; color: var(--dim); }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #header .dot.running { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #messages { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .row { margin-bottom: 14px; max-width: 82%; }
  .row.user { margin-left: auto; }
  .bubble {
    padding: 9px 12px; border-radius: 10px; white-space: pre-wrap;
    word-break: break-word; overflow-wrap: anywhere;
  }
  .row.user .bubble { background: var(--user); }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .row.system { max-width: 100%; text-align: center; }
  .row.system .bubble {
    background: transparent; color: var(--dim); font-size: 12px; padding: 2px 8px;
  }
  .tool-card {
    background: var(--tool); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
    color: #c9d1e0;
  }
  .tool-card .nm { color: var(--accent); margin-right: 6px; }
  .thinking {
    background: transparent; border: 1px dashed var(--border); border-radius: 8px;
    padding: 8px 10px; color: var(--dim); font-size: 12.5px; margin-bottom: 8px;
  }
  .thinking summary { cursor: pointer; color: var(--dim); }
  .thinking .body { white-space: pre-wrap; word-break: break-word; margin-top: 6px; }
  .toolcall-line {
    font-family: Consolas, monospace; font-size: 12.5px; color: var(--dim);
    margin-top: 6px; word-break: break-all;
  }
  /* 输入区 */
  #composer { border-top: 1px solid var(--border); padding: 12px 16px; }
  #input-wrap { display: flex; gap: 8px; }
  #input {
    flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font: inherit; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #input:disabled { opacity: .5; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 16px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost {
    background: transparent; color: var(--dim); border: 1px solid var(--border);
    padding: 6px 10px; font-size: 12.5px;
  }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  #statusbar {
    padding: 6px 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--dim);
  }
  /* 确认模态框 */
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
    align-items: center; justify-content: center; z-index: 10; }
  #modal.show { display: flex; }
  #modal .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; width: 460px; max-width: 90vw;
  }
  #modal h3 { margin-bottom: 8px; }
  #modal .args {
    background: var(--tool); border-radius: 6px; padding: 8px 10px; margin: 10px 0;
    font-family: Consolas, monospace; font-size: 12.5px; white-space: pre-wrap;
    word-break: break-all; max-height: 160px; overflow-y: auto;
  }
  #modal .btns { display: flex; gap: 8px; justify-content: flex-end; }
  #modal .btns .reject { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
</style>
</head>
<body>
<aside id="sidebar">
  <h1><span>vgent</span> — agent CLI</h1>
  <div id="session-list"></div>
  <div class="actions">
    <button class="ghost" onclick="newSession()">＋ 新建会话</button>
    <button class="ghost" onclick="loadSessions()">刷新</button>
  </div>
</aside>
<main id="main">
  <header id="header">
    <span id="state-dot" class="dot"></span>
    <span id="title" class="title">—</span>
    <span id="meta" class="meta"></span>
  </header>
  <div id="messages"></div>
  <div id="composer">
    <div id="input-wrap">
      <input id="input" type="text" placeholder="输入消息；斜杠命令：/plan /compact /remember /recall /memories /mcp /reasoning /help" autocomplete="off">
      <button id="send" onclick="send()">发送</button>
    </div>
  </div>
  <div id="statusbar">vgent</div>
</main>

<div id="modal">
  <div class="box">
    <h3>工具调用需确认：<span id="modal-tool"></span></h3>
    <div class="args" id="modal-args"></div>
    <div class="btns">
      <button class="reject" onclick="confirmResult('reject')">n 拒绝</button>
      <button class="ghost" onclick="confirmResult('always')">a 本会话总是</button>
      <button onclick="confirmResult('approve')">y 执行一次</button>
    </div>
  </div>
</div>

<script>
"use strict";
const state = {
  sid: null, es: null, running: false, tokens: 0,
  activeBubble: null, activeThinking: null, plan: null,
  confirmOpen: false,
};
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

/* -- 会话侧栏 ------------------------------------------------------------ */

async function loadSessions() {
  const data = await api("/api/sessions");
  const list = $("session-list");
  list.innerHTML = "";
  if (!data.sessions.length) {
    const d = document.createElement("div");
    d.className = "session-item";
    d.innerHTML = '<div class="t">（暂无会话）</div>';
    list.appendChild(d);
    return;
  }
  for (const s of data.sessions) {
    const el = document.createElement("div");
    el.className = "session-item" + (s.id === state.sid ? " active" : "");
    const badge = s.state ? '<span class="badge">' + s.state + "</span>" : "";
    el.innerHTML = '<div class="t">' + esc(s.title) + badge + "</div>" +
      '<div class="m">' + s.message_count + " 条 · " + esc(s.created_at.slice(0, 16)) + "</div>";
    el.onclick = () => selectSession(s.id);
    list.appendChild(el);
  }
}

async function newSession() {
  const data = await api("/api/sessions", { method: "POST" });
  await selectSession(data.session_id);
}

/* -- 会话选择与历史渲染 ----------------------------------------------------- */

async function selectSession(sid) {
  state.sid = sid;
  $("messages").innerHTML = "";
  state.activeBubble = null; state.activeThinking = null; state.plan = null;
  openStream(sid);
  const data = await api("/api/sessions/" + sid);
  $("title").textContent = data.session.title;
  $("meta").textContent = "[" + data.provider_name + "] " + data.provider_model;
  for (const m of data.messages) renderMessage(m);
  state.plan = data.plan;
  setRunning(data.running);
  renderStatus({ state: data.state, plan: data.plan });
  await loadSessions();
}

function renderMessage(m) {
  if (m.role === "system") {
    addSystem(m.content);
  } else if (m.role === "user") {
    addUser(m.content);
  } else if (m.role === "assistant") {
    if (m.reasoning_content) addThinking(m.reasoning_content, true);
    if (m.content) addAssistant(m.content);
    if (m.tool_calls && m.tool_calls.length) {
      for (const tc of m.tool_calls) {
        addToolCallLine(tc.name, tc.arguments);
      }
    }
  } else if (m.role === "tool") {
    addToolCard("tool", m.content);
  }
}

function addRow(cls, html) {
  const row = document.createElement("div");
  row.className = "row " + cls;
  row.innerHTML = html;
  $("messages").appendChild(row);
  scrollBottom();
  return row;
}
function addUser(text) {
  return addRow("user", '<div class="bubble">' + esc(text) + "</div>");
}
function addAssistant(text) {
  const row = addRow("assistant", '<div class="bubble"></div>');
  row.querySelector(".bubble").textContent = text;
  return row;
}
function addSystem(text) {
  return addRow("system", '<div class="bubble">' + esc(text) + "</div>");
}
function addThinking(text, collapsed) {
  const row = document.createElement("div");
  row.className = "row assistant";
  row.innerHTML = '<div class="thinking"><details' + (collapsed ? "" : " open") +
    '><summary>思考</summary><div class="body"></div></details></div>';
  row.querySelector(".body").textContent = text;
  $("messages").appendChild(row);
  scrollBottom();
  return row;
}
function addToolCard(name, summary) {
  return addRow("assistant", '<div class="tool-card"><span class="nm">→ ' + esc(name) +
    "</span>" + esc(summary) + "</div>");
}
function addToolCallLine(name, args) {
  return addRow("assistant", '<div class="toolcall-line">⚙ ' + esc(name) +
    "(" + esc(args) + ")</div>");
}
function scrollBottom() { $("messages").scrollTop = $("messages").scrollHeight; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* -- SSE 事件流 ----------------------------------------------------------- */

function openStream(sid) {
  if (state.es) state.es.close();
  const es = new EventSource("/api/sessions/" + sid + "/stream");
  es.addEventListener("ready", () => { /* 连接就绪 */ });
  es.addEventListener("delta", (e) => onDelta(JSON.parse(e.data)));
  es.addEventListener("reasoning", (e) => onReasoning(JSON.parse(e.data)));
  es.addEventListener("tool", (e) => onTool(JSON.parse(e.data)));
  es.addEventListener("confirm", (e) => onConfirm(JSON.parse(e.data)));
  es.addEventListener("done", (e) => onDone(JSON.parse(e.data)));
  es.addEventListener("error", (e) => onStreamError(JSON.parse(e.data)));
  es.addEventListener("status", (e) => setRunning(JSON.parse(e.data).running));
  es.onerror = () => { /* EventSource 自动重连 */ };
  state.es = es;
}

function onDelta(d) {
  if (!state.activeBubble) state.activeBubble = addAssistant("");
  state.activeBubble.querySelector(".bubble").textContent += d.text;
  scrollBottom();
}
function onReasoning(d) {
  if (!state.activeThinking) state.activeThinking = addThinking("", false);
  state.activeThinking.querySelector(".body").textContent += d.text;
  scrollBottom();
}
function onTool(d) { addToolCard(d.name, d.summary); }
function onDone(d) {
  state.activeBubble = null; state.activeThinking = null;
  if (d.usage) state.tokens += d.usage.total_tokens;
  state.plan = d.plan;
  renderStatus({ state: d.state, plan: d.plan, usage: d.usage });
  setRunning(false);
  loadSessions();
}
function onStreamError(d) {
  addSystem("调用失败：" + d.message);
  state.activeBubble = null; state.activeThinking = null;
  setRunning(false);
}
function onConfirm(d) {
  state.confirmOpen = true;
  $("modal-tool").textContent = d.tool + "（" + d.permission + " 档）";
  $("modal-args").textContent = JSON.stringify(d.args, null, 2);
  $("modal").classList.add("show");
}
async function confirmResult(result) {
  $("modal").classList.remove("show");
  state.confirmOpen = false;
  try {
    await api("/api/sessions/" + state.sid + "/confirm", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ result }),
    });
  } catch (e) { addSystem("确认回传失败：" + e.message); }
}

/* -- 发送与命令 ------------------------------------------------------------ */

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || state.running) return;
  input.value = "";
  if (text.startsWith("/")) return doCommand(text);
  state.running = true; setRunning(true);
  addUser(text);
  state.activeBubble = null; state.activeThinking = null;
  try {
    await api("/api/sessions/" + state.sid + "/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text }),
    });
  } catch (e) {
    addSystem("发送失败：" + e.message);
    setRunning(false);
  }
}

async function doCommand(text) {
  try {
    const data = await api("/api/sessions/" + state.sid + "/command", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: text }),
    });
    addSystem(data.text);
  } catch (e) {
    addSystem("命令失败：" + e.message);
  }
}

/* -- 状态栏 ---------------------------------------------------------------- */

function renderStatus(s) {
  const parts = ["vgent"];
  if (s.state) parts.push("状态 " + s.state);
  if (s.plan && s.plan.steps && s.plan.steps.length) {
    const done = s.plan.steps.filter((x) => x.status === "done").length;
    parts.push("计划 " + done + "/" + s.plan.steps.length);
  }
  parts.push("累计 " + state.tokens + " tok");
  if (s.usage) parts.push("本轮 ↑" + s.usage.prompt_tokens + " ↓" + s.usage.completion_tokens);
  $("statusbar").textContent = parts.join(" · ");
}

function setRunning(r) {
  state.running = r;
  $("state-dot").className = "dot" + (r ? " running" : "");
  $("input").disabled = r;
  $("send").disabled = r;
}

/* -- 初始化 ---------------------------------------------------------------- */

$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
(async () => {
  try {
    const data = await api("/api/sessions");
    if (data.sessions.length) {
      await selectSession(data.sessions[0].id);
    } else {
      await newSession();
    }
  } catch (e) {
    addSystem("无法连接 vgent 服务：" + e.message);
  }
})();
</script>
</body>
</html>
