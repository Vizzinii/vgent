[project]
name = "vgent"
version = "0.1.0"
description = "通用 agent CLI（参考主流实现，各取所长）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp<2",
    "openai>=1.40",
    "prompt-toolkit>=3.0",
    "rich>=13.7",
    "tiktoken>=0.14.0",
]

[project.scripts]
vgent = "vgent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
